name: CRM XUI status checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ks-customer-status.yml'
      - 'api/ks-roomba-crm.js'
      - '_server/ks-roomba-*.js'
      - '_server/ks-crm-renewal-*.js'
      - '_server/ks-fixie-proxy.js'
      - 'src/pages/admin/RoombaCustomerStatus.tsx'
      - 'src/pages/admin/LiveRenewalControls.tsx'
      - 'src/pages/admin/CRMOperationsCenter.tsx'
      - 'scripts/test-ks-roomba-customer-status.mjs'
      - 'scripts/test-ks-roomba-renewal-review.mjs'
      - 'scripts/test-ks-crm-renewal-*.mjs'
      - 'scripts/fixtures/ks-crm-renewal/**'
      - 'scripts/ks-crm-renewal-simulation-readme.md'
      - 'scripts/ks-crm-renewal-screen-readme.md'
      - 'package*.json'

permissions:
  contents: read

jobs:
  read-only-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthetic provider and CRM checks (no connected credentials)
        run: |
          node scripts/test-ks-roomba-customer-status.mjs
          node scripts/test-ks-roomba-renewal-review.mjs
          node scripts/test-ks-crm-renewal-simulation.mjs
          node scripts/test-ks-crm-renewal-approval.mjs
          node scripts/test-ks-crm-renewal-test-approval.mjs
          node scripts/test-ks-crm-renewal-live-consent.mjs
          node scripts/test-ks-crm-renewal-live-http.mjs
          node scripts/test-ks-roomba-admin.mjs
          node scripts/test-ks-roomba-preview.mjs
          node scripts/test-ks-roomba-line.mjs
          node scripts/test-ks-roomba-crm.mjs
      - name: Check changed React components
        run: >-
          npx eslint src/pages/admin/RoombaCustomerStatus.tsx
          src/pages/admin/LiveRenewalControls.tsx
          src/pages/admin/CRMOperationsCenter.tsx
          --rule '@typescript-eslint/no-unused-expressions: ["error", {"allowShortCircuit": false,"allowTernary": false,"allowTaggedTemplates": false}]'
      - run: npm run build
