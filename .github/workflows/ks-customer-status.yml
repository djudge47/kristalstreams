name: CRM XUI status checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ks-customer-status.yml'
      - 'api/ks-roomba-crm.js'
      - '_server/ks-roomba-*.js'
      - '_server/ks-crm-renewal-*.js'
      - '_server/ks-fixie-proxy.js'
      - 'src/pages/admin/RoombaCustomerStatus.tsx'
      - 'src/pages/admin/RequestedRenewalReview.tsx'
      - 'src/pages/admin/LiveRenewalControls.tsx'
      - 'src/pages/admin/OrderRenewalControls.tsx'
      - 'src/pages/admin/CRMOperationsCenter.tsx'
      - 'src/pages/admin/CRMPremiumOverview.tsx'
      - 'scripts/test-ks-crm-legacy-payments.mjs'
      - 'scripts/ks-crm-legacy-payment-confirmation.sql'
      - 'src/pages/admin/BulkXuiCheck.tsx'
      - '_shared/ks-crm-bulk-check.*'
      - '_shared/ks-crm-service-sync-client.*'
      - '_server/ks-crm-service-sync.js'
      - 'src/pages/admin/BulkCrmServiceSync.tsx'
      - 'scripts/test-ks-crm-service-sync*.mjs'
      - 'scripts/ks-crm-bulk-service-sync-schema.sql'
      - 'scripts/test-ks-crm-bulk-check.mjs'
      - 'scripts/test-ks-roomba-customer-status.mjs'
      - 'scripts/test-ks-roomba-renewal-review.mjs'
      - 'scripts/test-ks-crm-renewal-*.mjs'
      - 'scripts/fixtures/ks-crm-renewal/**'
      - 'scripts/ks-crm-renewal-simulation-readme.md'
      - 'scripts/ks-crm-renewal-screen-readme.md'
      - '_shared/ks-retail-pricing.*'
      - '_shared/ks-crm-status.*'
      - 'scripts/ks-crm-personal-credit-accounts-schema.sql'
      - '_server/ks-payment-validation.js'
      - 'src/components/PricingPlans.tsx'
      - 'src/pages/pricing/**'
      - 'scripts/ks-crm-renewal-retail-pricing-schema.sql'
      - 'package*.json'

permissions:
  contents: read

jobs:
  read-only-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned isolated SQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/ks-sync-db" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Bulk CRM sync SQL and client checks (fictional accounts only)
        run: |
          KS_PGLITE_MODULE="$RUNNER_TEMP/ks-sync-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-ks-crm-service-sync.mjs
          node scripts/test-ks-crm-service-sync-client.mjs
          KS_PGLITE_MODULE="$RUNNER_TEMP/ks-sync-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-ks-crm-legacy-payments.mjs
      - name: Synthetic provider and CRM checks (no connected credentials)
        run: |
          node scripts/test-ks-crm-renewal-retail-pricing.mjs
          node scripts/test-ks-payments.mjs
          node scripts/test-ks-roomba-customer-status.mjs
          node scripts/test-ks-crm-bulk-check.mjs
          node scripts/test-ks-roomba-renewal-review.mjs
          node scripts/test-ks-crm-renewal-order-review.mjs
          node scripts/test-ks-crm-renewal-simulation.mjs
          node scripts/test-ks-crm-renewal-approval.mjs
          node scripts/test-ks-crm-renewal-test-approval.mjs
          node scripts/test-ks-crm-renewal-live-consent.mjs
          node scripts/test-ks-crm-renewal-live-http.mjs
          node scripts/test-ks-roomba-admin.mjs
          node scripts/test-ks-roomba-preview.mjs
          node scripts/test-ks-roomba-line.mjs
          node scripts/test-ks-roomba-crm.mjs
      - name: Check changed React components
        run: >-
          npx eslint src/pages/admin/RoombaCustomerStatus.tsx
          src/pages/admin/RequestedRenewalReview.tsx
          src/pages/admin/LiveRenewalControls.tsx
          src/pages/admin/OrderRenewalControls.tsx
          src/pages/admin/CRMOperationsCenter.tsx
          src/pages/admin/CRMPremiumOverview.tsx
          src/pages/admin/BulkXuiCheck.tsx
          src/pages/admin/BulkCrmServiceSync.tsx
          --rule '@typescript-eslint/no-unused-expressions: ["error", {"allowShortCircuit": false,"allowTernary": false,"allowTaggedTemplates": false}]'
      - run: npm run build
