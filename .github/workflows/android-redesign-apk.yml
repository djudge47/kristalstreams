name: Build Kristal Streams Redesign APK

on:
  workflow_dispatch:
  push:
    branches:
      - ks-redesign-wiring
    paths:
      - 'android/redesign/**'
      - 'android/overrides/**'
      - 'android/r4-text-source/**'
      - '.github/workflows/android-redesign-apk.yml'

permissions:
  contents: read

jobs:
  build-redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: ks-redesign-wiring
          fetch-depth: 0

      - name: Restore canonical R4 Android project
        run: |
          set -euo pipefail
          rm -rf android/player .android-import
          mkdir -p android/player .android-import
          cat android/r4-text-source/part-*.b64 | base64 --decode > /tmp/KristalStreams-R4-text.tar.gz
          gzip -t /tmp/KristalStreams-R4-text.tar.gz
          tar -xzf /tmp/KristalStreams-R4-text.tar.gz -C .android-import
          SOURCE_APP="$(find .android-import -path '*/app/build.gradle.kts' -type f | head -n 1)"
          test -n "$SOURCE_APP"
          SOURCE_DIR="${SOURCE_APP%/app/build.gradle.kts}"
          rsync -a "$SOURCE_DIR/" android/player/
          echo "PROJECT_DIR=${GITHUB_WORKSPACE}/android/player" >> "$GITHUB_ENV"

      - name: Apply stable player and Gradle overrides
        run: |
          set -euo pipefail
          for file in build.gradle.kts settings.gradle.kts gradle.properties; do cp "android/overrides/$file" "android/player/$file"; done
          cp android/overrides/app-build.gradle.kts android/player/app/build.gradle.kts
          cp android/overrides/PlayerActivity.kt android/player/app/src/main/java/com/kristalstreams/player/PlayerActivity.kt
          bash android/overrides/restore-good-assets.sh

      - name: Apply Kristal red black redesign overlay
        run: |
          set -euo pipefail
          test -d android/redesign/app/src/main
          rsync -a android/redesign/app/src/main/ android/player/app/src/main/
          echo 'Redesign overlay applied.'
          find android/redesign -type f | sort

      - name: Ensure redesign branding resources
        run: |
          set -euo pipefail
          RES="android/player/app/src/main/res"
          mkdir -p "$RES/drawable"
          make_shape() {
            local name="$1" color="$2" stroke="$3" radius="$4"
            if ! find "$RES" -type f \( -name "$name.png" -o -name "$name.jpg" -o -name "$name.jpeg" -o -name "$name.webp" -o -name "$name.xml" \) | grep -q .; then
              printf '%s\n' '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">' "    <solid android:color=\"$color\" />" "    <stroke android:width=\"2dp\" android:color=\"$stroke\" />" "    <corners android:radius=\"$radius\" />" '</shape>' > "$RES/drawable/$name.xml"
              echo "Created fallback drawable: $name"
            fi
          }
          make_shape ks_banner "#080B12" "#F20D19" "12dp"
          make_shape ks_badge "#F20D19" "#FFFFFF" "18dp"
          make_shape official_dashboard_bg "#080B12" "#151A24" "0dp"
          make_shape official_live_tv "#151A24" "#F20D19" "14dp"
          make_shape official_live_tv_focused "#F20D19" "#FFFFFF" "14dp"
          make_shape official_movies "#151A24" "#F20D19" "14dp"
          make_shape official_movies_focused "#F20D19" "#FFFFFF" "14dp"
          make_shape official_series "#151A24" "#F20D19" "14dp"
          make_shape official_series_focused "#F20D19" "#FFFFFF" "14dp"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('android/player/app/src/main')
          res = root / 'res'
          refs = set()
          for p in list(res.rglob('*.xml')) + [root / 'AndroidManifest.xml']:
              if not p.exists():
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              refs.update(re.findall(r'(?<!android:)@drawable/([A-Za-z0-9_]+)', text))
          exts = ('.xml', '.png', '.jpg', '.jpeg', '.webp', '.gif')
          created = []
          for name in sorted(refs):
              exists = any((d / f'{name}{e}').exists() for d in res.glob('drawable*') if d.is_dir() for e in exts)
              if not exists:
                  target = res / 'drawable' / f'{name}.xml'
                  target.write_text('<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n    <solid android:color="#151A24" />\n    <stroke android:width="1dp" android:color="#F20D19" />\n    <corners android:radius="10dp" />\n</shape>\n', encoding='utf-8')
                  created.append(name)
          print(f'Resource references checked: {len(refs)}; fallbacks created: {len(created)}')
          for name in created:
              print(f'  + {name}')
          PY

      - name: Validate Phase 1 wiring
        run: |
          set -euo pipefail
          test -f android/player/app/src/main/java/com/kristalstreams/player/HomeActivity.kt
          test -f android/player/app/src/main/java/com/kristalstreams/player/ChannelsActivity.kt
          test -f android/player/app/src/main/java/com/kristalstreams/player/GuideActivity.kt
          test -f android/player/app/src/main/res/layout/activity_home.xml
          test -f android/player/app/src/main/res/layout/activity_channels.xml
          test -f android/player/app/src/main/res/layout/activity_guide.xml
          test -f android/player/app/src/main/res/values/colors.xml
          grep -q '#F20D19' android/player/app/src/main/res/values/colors.xml
          find android/player/app/src/main/res -type f \( -name 'ks_banner.xml' -o -name 'ks_banner.png' -o -name 'ks_banner.jpg' -o -name 'ks_banner.webp' \) | grep -q .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build redesign debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Publish redesign APK
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/KristalStreams-RED-BLACK-PHASE1-debug.apk

      - name: Upload redesign APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KristalStreams-Red-Black-Phase1-APK
          path: out/KristalStreams-RED-BLACK-PHASE1-debug.apk
          retention-days: 30
          if-no-files-found: error
