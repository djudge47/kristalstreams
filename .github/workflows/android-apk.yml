name: Build Kristal Streams Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-dev
    paths:
      - 'android/R4_READY.txt'
      - 'android/overrides/**'
      - 'android/bootstrap/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout android-dev
        uses: actions/checkout@v4
        with:
          ref: android-dev
          fetch-depth: 0

      - name: Restore shared Android project
        run: |
          rm -rf android/player .android-import
          if [ -d android/r4-source-parts ]; then
            echo "Restoring from R4 source chunks"
            cat android/r4-source-parts/part-*.txt | base64 --decode > /tmp/KristalStreams-R4.zip
            unzip -tq /tmp/KristalStreams-R4.zip
            mkdir -p .android-import android/player
            unzip -q /tmp/KristalStreams-R4.zip -d .android-import
            SOURCE_DIR="$(find .android-import -name gradlew -type f -printf '%h\n' | head -n 1)"
            test -n "$SOURCE_DIR" || { echo "gradlew was not found in the R4 source"; exit 1; }
            rsync -a --delete "$SOURCE_DIR/" android/player/
          else
            echo "R4 source chunks are unavailable; restoring from preserved bootstrap source"
            test -f android/bootstrap/source.part-000 || { echo "Missing bootstrap source"; exit 1; }
            cat android/bootstrap/source.part-* > /tmp/rebuild-android.sh
            chmod +x /tmp/rebuild-android.sh
            /tmp/rebuild-android.sh
          fi
          test -f android/player/gradlew
          test -f android/player/app/build.gradle.kts
          test -f android/player/app/src/main/java/com/kristalstreams/player/PlayerActivity.kt
          echo "PROJECT_DIR=${GITHUB_WORKSPACE}/android/player" >> "$GITHUB_ENV"

      - name: Apply Android playback overrides
        run: |
          if [ -f android/overrides/PlayerActivity.kt ]; then
            cp android/overrides/PlayerActivity.kt android/player/app/src/main/java/com/kristalstreams/player/PlayerActivity.kt
          fi

      - name: Save shared Android source to android-dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android/player
          if ! git diff --cached --quiet; then
            git commit -m "Import Kristal Streams R4 Android source"
            git push origin HEAD:android-dev
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/player/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build R4 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Publish APK into the shared project
        run: |
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -type f | head -n 1)"
          test -n "$APK" || { echo "APK was not produced"; exit 1; }
          mkdir -p android/releases out
          cp "$APK" android/releases/KristalStreams-R4-debug.apk
          cp "$APK" out/KristalStreams-R4-debug.apk
          git add android/releases/KristalStreams-R4-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Kristal Streams R4 debug APK"
            git push origin HEAD:android-dev
          fi

      - name: Upload Kristal Streams APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KristalStreams-R4-APK
          path: out/KristalStreams-R4-debug.apk
          retention-days: 30
          if-no-files-found: error
