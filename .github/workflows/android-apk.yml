name: Build Kristal Streams Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-dev
    paths:
      - 'android/R4_READY.txt'
      - 'android/overrides/**'
      - 'android/bootstrap/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout android-dev
        uses: actions/checkout@v4
        with:
          ref: android-dev
          fetch-depth: 0

      - name: Restore shared Android project
        run: |
          rm -rf android/player .android-import
          if [ -d android/r4-source-parts ]; then
            echo "Restoring from R4 source chunks"
            cat android/r4-source-parts/part-*.txt | base64 --decode > /tmp/KristalStreams-R4.zip
            unzip -tq /tmp/KristalStreams-R4.zip
            mkdir -p .android-import android/player
            unzip -q /tmp/KristalStreams-R4.zip -d .android-import
            SOURCE_DIR="$(find .android-import -name gradlew -type f -printf '%h\n' | head -n 1)"
            test -n "$SOURCE_DIR" || { echo "gradlew was not found in the R4 source"; exit 1; }
            rsync -a --delete "$SOURCE_DIR/" android/player/
          else
            echo "R4 source chunks unavailable; recovering every complete file embedded in the preserved bootstrap"
            python3 - <<'PY'
          import base64
          import glob
          import pathlib
          import re

          text = ''.join(pathlib.Path(p).read_text() for p in sorted(glob.glob('android/bootstrap/source.part-*')))
          pattern = re.compile(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d > \"([^\"]+)\"")
          recovered = 0
          for payload, raw_path in pattern.findall(text):
              path = raw_path.replace('$ROOT', 'android/player')
              out = pathlib.Path(path)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(base64.b64decode(payload))
              recovered += 1
          print(f'Recovered {recovered} complete bootstrap files')
          if recovered == 0:
              raise SystemExit('No complete bootstrap files were recovered')
          PY
          fi
          test -f android/player/app/build.gradle.kts || { echo "Missing app/build.gradle.kts after recovery"; find android/player -maxdepth 4 -type f | sort; exit 1; }
          test -f android/player/app/src/main/AndroidManifest.xml || { echo "Missing AndroidManifest.xml after recovery"; exit 1; }
          echo "PROJECT_DIR=${GITHUB_WORKSPACE}/android/player" >> "$GITHUB_ENV"

      - name: Apply Android playback overrides
        run: |
          test -f android/overrides/PlayerActivity.kt || { echo "Missing playback override"; exit 1; }
          mkdir -p android/player/app/src/main/java/com/kristalstreams/player
          cp android/overrides/PlayerActivity.kt android/player/app/src/main/java/com/kristalstreams/player/PlayerActivity.kt

      - name: Verify recovered Android project
        run: |
          test -f android/player/gradlew || { echo "gradlew is missing"; exit 1; }
          test -f android/player/gradle/wrapper/gradle-wrapper.jar || { echo "gradle-wrapper.jar is missing"; exit 1; }
          test -f android/player/app/src/main/java/com/kristalstreams/player/XtreamClient.kt || { echo "XtreamClient.kt is missing"; exit 1; }
          test -f android/player/app/src/main/java/com/kristalstreams/player/LibraryActivity.kt || { echo "LibraryActivity.kt is missing"; exit 1; }
          test -f android/player/app/src/main/java/com/kristalstreams/player/SeriesDetailsActivity.kt || { echo "SeriesDetailsActivity.kt is missing"; exit 1; }
          test -f android/player/app/src/main/java/com/kristalstreams/player/ChannelsActivity.kt || { echo "ChannelsActivity.kt is missing"; exit 1; }
          echo "Recovered project contains Movies, Series, Live TV, and Player source paths."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/player/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build R4 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Publish APK into the shared project
        run: |
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -type f | head -n 1)"
          test -n "$APK" || { echo "APK was not produced"; exit 1; }
          mkdir -p android/releases out
          cp "$APK" android/releases/KristalStreams-R4-debug.apk
          cp "$APK" out/KristalStreams-R4-debug.apk

      - name: Upload Kristal Streams APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KristalStreams-R4-APK
          path: out/KristalStreams-R4-debug.apk
          retention-days: 30
          if-no-files-found: error
