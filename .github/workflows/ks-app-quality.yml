name: Application quality

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  app-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check locked npm dependencies for high and critical advisories
        run: npm audit --audit-level=high --ignore-scripts --package-lock-only --fetch-retries=1 --fetch-timeout=15000
      - run: npm run check
      - name: Verify reviewed framework versions, parser fix and reviewed stylesheet baseline
        run: node scripts/test-ks-framework-upgrade.mjs
      - name: Verify navigation and responsive customer workspace in an offline browser
        env:
          KS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/ks-browser/node_modules/playwright-core/index.mjs
          KS_CHROMIUM_MODULE: ${{ runner.temp }}/ks-browser/node_modules/@sparticuz/chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/ks-browser" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1 @sparticuz/chromium@143.0.4
          node scripts/test-ks-framework-browser.mjs
          node scripts/test-ks-checkout-services-browser.mjs
          node scripts/test-ks-renewal-status-browser.mjs
          node scripts/test-ks-payment-history-browser.mjs
          node scripts/test-ks-admin-payment-history-browser.mjs
      - name: Verify Production and Preview portal and manual receipts with disposable SQL
        run: |
          npm install --prefix /tmp/ks-release-fixtures --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.10
          for deployment_env in preview production; do
            KS_TEST_DEPLOYMENT_ENV="$deployment_env" KS_PGLITE_MODULE=/tmp/ks-release-fixtures/node_modules/@electric-sql/pglite/dist/index.js node scripts/test-ks-checkout-services.mjs
            KS_TEST_DEPLOYMENT_ENV="$deployment_env" KS_PGLITE_MODULE=/tmp/ks-release-fixtures/node_modules/@electric-sql/pglite/dist/index.js node scripts/test-ks-customer-crm.mjs
            KS_TEST_DEPLOYMENT_ENV="$deployment_env" KS_PGLITE_MODULE=/tmp/ks-release-fixtures/node_modules/@electric-sql/pglite/dist/index.js node scripts/test-ks-crm-renewal-payments.mjs
          done
          node scripts/test-ks-roomba-crm.mjs
      - name: Verify help, payment, support and portal regressions with offline fixtures
        run: |
          node scripts/test-ks-download-page.mjs
          node scripts/test-ks-admin-modules.mjs
          node scripts/test-ks-navigation.mjs
          node scripts/test-ks-login-destination.mjs
          node scripts/test-ks-login-flow.mjs
          node scripts/test-ks-general-chat.mjs
          node scripts/test-ks-website-playback.mjs
          node scripts/test-ks-playback-preferences.mjs
          node scripts/test-ks-website-password.mjs
          node scripts/test-ks-password-recovery.mjs
          node scripts/test-ks-password-reset-request.mjs
          node scripts/test-ks-help-content.mjs
          node scripts/test-ks-payments.mjs
          node scripts/test-ks-live-receipt-rollout.mjs
          node scripts/test-ks-checkout-attempt.mjs
          node scripts/test-ks-checkout-client.mjs
          node scripts/test-ks-checkout-origin.mjs
          node scripts/test-ks-checkout-view.mjs
          for checkout_mode in preview production; do
            KS_TEST_CHECKOUT_MODE="$checkout_mode" KS_PGLITE_MODULE=/tmp/ks-release-fixtures/node_modules/@electric-sql/pglite/dist/index.js node scripts/test-ks-checkout-intent.mjs
          done
          KS_PGLITE_MODULE=/tmp/ks-release-fixtures/node_modules/@electric-sql/pglite/dist/index.js node scripts/test-ks-paid-order-routing-db.mjs
          KS_PGLITE_MODULE=/tmp/ks-release-fixtures/node_modules/@electric-sql/pglite/dist/index.js node scripts/test-ks-paid-renewal-verification.mjs
          node scripts/test-ks-crm-renewal-live-http.mjs
          KS_PGLITE_MODULE=/tmp/ks-release-fixtures/node_modules/@electric-sql/pglite/dist/index.js node scripts/test-ks-pending-order-email-db.mjs
          node scripts/test-ks-support-client.mjs
          node scripts/test-ks-support-ui.mjs
          node scripts/test-ks-crm-directory.mjs
          node scripts/test-ks-crm-payment-summary.mjs
          node scripts/test-ks-crm-overview-payments.mjs
          TZ=America/New_York node scripts/test-ks-customer-crm-ui.mjs
          TZ=Asia/Tokyo node scripts/test-ks-customer-crm-ui.mjs
          node scripts/test-ks-customer-setup.mjs
          node scripts/test-ks-customer-status-view.mjs
          node scripts/test-ks-customer-activity.mjs
          node scripts/test-ks-account-profile.mjs
          node scripts/test-ks-customer-tickets.mjs
          node scripts/test-ks-customer-dashboard.mjs
          node scripts/test-ks-customer-subscription.mjs
